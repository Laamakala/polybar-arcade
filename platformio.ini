[platformio]
default_envs = pico-wokwi


[env]
platform = raspberrypi
board = pico
framework = arduino

monitor_speed = 115200

lib_deps =
    adafruit/Adafruit GFX Library
    adafruit/Adafruit DotStar
    khoih-prog/LittleFS_Mbed_RP2040


[env:pico-wokwi]
build_flags =
    -D WOKWI_SIMULATION

lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ILI9341
    https://github.com/adafruit/Adafruit_NeoPixel.git#1.15.0


[env:pico-physical]
lib_deps =
    ${env.lib_deps}
    adafruit/Adafruit ST7735 and ST7789 Library